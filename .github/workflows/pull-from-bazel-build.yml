name: Pull Fresh Upstream Documentation

on:
  workflow_call:
    inputs:
      bazelCommitHash:
        description: 'Specific Bazel commit hash to checkout (optional)'
        required: false
        type: string
        default: ''
      bazelPullRequestNumber:
        description: 'Bazel PR number (optional, used to fetch PR refs)'
        required: false
        type: string
        default: ''
      is_internal_pr:
        description: 'Whether this is an internal PR (not from a fork)'
        required: false
        type: boolean
        default: true
      bazelBaseCommitHash:
        description: 'Base Bazel commit hash for change detection (optional)'
        required: false
        type: string
        default: ''
      target_branch:
        description: 'Branch to commit docs updates to (optional)'
        required: false
        type: string
        default: ''
      detect_upstream_docs_changes:
        description: 'Skip the conversion pipeline when upstream docs or reference-doc inputs are unchanged'
        required: false
        type: boolean
        default: false
      trust_upstream_code:
        description: >
          Whether the upstream commit being checked out is trusted enough to execute.
          Building reference docs runs Bazel over upstream BUILD/Starlark files, which is
          arbitrary code execution. Must be false for commits from forks. Distinct from
          is_internal_pr, which controls write access to *this* repo.
        required: false
        type: boolean
        default: true
    secrets:
      # Declared explicitly so callers can pass a narrowed set instead of `secrets: inherit`.
      # Callers that still use `inherit` keep working.
      GH_APP_ID:
        required: false
      GH_APP_PRIVATE_KEY:
        required: false
      BUILDBUDDY_ORG_API_KEY:
        required: false

jobs:
  pull-fresh-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - uses: actions/create-github-app-token@v3
        id: generate-token
        if: ${{ inputs.is_internal_pr }}
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository (internal PR)
        if: ${{ inputs.is_internal_pr }}
        uses: actions/checkout@v7
        with:
          submodules: false
          token: ${{ steps.generate-token.outputs.token }}
          # Keep the App token out of .git/config, where later steps — including
          # anything the upstream build spawns — could read it. Pushes below supply
          # it from the environment instead.
          persist-credentials: false

      - name: Checkout repository (fork)
        if: ${{ !inputs.is_internal_pr }}
        uses: actions/checkout@v7
        with:
          submodules: false
          # No token is provided, so the action will use the default GITHUB_TOKEN
          # with fork-safe, read-only permissions.
          persist-credentials: false

      - name: Configure Git credentials
        if: ${{ inputs.is_internal_pr }}
        env:
          GH_APP_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Helper reads the token from the environment at push time, so it is never
          # written to disk or passed as a process argument.
          git config credential.helper \
            '!f() { echo username=x-access-token; echo "password=${GH_APP_TOKEN}"; }; f'

      - name: Checkout submodules
        run: git submodule update --init -- upstream

      - name: Checkout commit of Bazel Build submodule
        if: ${{ inputs.bazelCommitHash != '' }}
        working-directory: upstream
        env:
          BAZEL_COMMIT_HASH: ${{ inputs.bazelCommitHash }}
          BAZEL_PR_NUMBER: ${{ inputs.bazelPullRequestNumber }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BAZEL_COMMIT_HASH}" 2>/dev/null; then
            if [[ -n "${BAZEL_PR_NUMBER}" ]]; then
              git fetch --no-tags origin "pull/${BAZEL_PR_NUMBER}/head"
            else
              git fetch --no-tags origin "${BAZEL_COMMIT_HASH}"
            fi
          fi
          git checkout "${BAZEL_COMMIT_HASH}"

      - name: Get changed files in upstream
        id: changed-files
        if: ${{ inputs.detect_upstream_docs_changes }}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          path: upstream
          base_sha: ${{ inputs.bazelBaseCommitHash }}
          sha: ${{ inputs.bazelCommitHash }}
          files: |
            docs/**
            src/main/java/com/google/devtools/build/docgen/**
            src/main/starlark/docgen/**
            tools/build_defs/repo/**
            scripts/docs/**
            site/command-line-reference-prefix.html
            site/command-line-reference-suffix.html
            site/BUILD
            site/BUILD.bazel

      - name: Determine if pipeline should run
        id: docs-changes
        run: |
          if [[ "${{ inputs.detect_upstream_docs_changes }}" != "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.changed-files.outputs.any_changed }}" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine reference docs regen mode
        id: reference-regen
        if: ${{ steps.docs-changes.outputs.should_run == 'true' }}
        env:
          ALL_CHANGED: ${{ steps.changed-files.outputs.all_changed_files }}
          TRUST_UPSTREAM: ${{ inputs.trust_upstream_code }}
          DETECT_CHANGES: ${{ inputs.detect_upstream_docs_changes }}
        run: |
          set -euo pipefail
          full_build=false
          split_trust=false

          if [[ "${DETECT_CHANGES}" != "true" ]]; then
            # Main sync: always run full reference doc build on trusted upstream.
            full_build=true
          elif [[ "${TRUST_UPSTREAM}" == "true" ]]; then
            for file in ${ALL_CHANGED}; do
              case "${file}" in
                scripts/docs/*|src/main/java/com/google/devtools/build/docgen/*|src/main/starlark/docgen/*|tools/build_defs/repo/*|site/command-line-reference-*|site/BUILD|site/BUILD.bazel)
                  full_build=true
                  break
                  ;;
              esac
            done
          else
            # Fork PR: regen reference MDX with trusted-base HTML + PR docs2mdx.py.
            for file in ${ALL_CHANGED}; do
              case "${file}" in
                scripts/docs/*)
                  split_trust=true
                  break
                  ;;
              esac
            done
          fi

          echo "full_build=${full_build}" >> "$GITHUB_OUTPUT"
          echo "split_trust=${split_trust}" >> "$GITHUB_OUTPUT"
          echo "Reference regen: full_build=${full_build}, split_trust=${split_trust}"

      - name: Ensure target branch exists for previews
        if: ${{ inputs.is_internal_pr && inputs.target_branch != '' && steps.docs-changes.outputs.should_run == 'true' }}
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          GH_APP_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" >/dev/null; then
            echo "Preview branch ${TARGET_BRANCH} already exists."
            exit 0
          fi
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Setup Bazel
        if: ${{ inputs.is_internal_pr && steps.docs-changes.outputs.should_run == 'true' && (steps.reference-regen.outputs.full_build == 'true' || steps.reference-regen.outputs.split_trust == 'true') }}
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
       
      - name: Build reference documentation
        # Runs Bazel over upstream BUILD/Starlark files, which is arbitrary code
        # execution. Never run this for a commit from a fork.
        if: ${{ inputs.is_internal_pr && steps.reference-regen.outputs.full_build == 'true' && steps.docs-changes.outputs.should_run == 'true' }}
        working-directory: upstream
        env:
          BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          set -euo pipefail
          # Keep the API key out of argv, where any process in the build could read it.
          rcfile="$(mktemp)"
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > "${rcfile}"
          bazel --bazelrc="${rcfile}" build \
            --config=docs \
            --build_metadata=ROLE=DOCS \
            --bes_results_url=https://app.buildbuddy.io/invocation/ \
            --bes_backend=grpcs://remote.buildbuddy.io \
            --remote_cache=grpcs://remote.buildbuddy.io \
            --remote_timeout=10m \
            //src/main/java/com/google/devtools/build/lib:gen_mdx_reference_docs

      - name: Regenerate reference docs (fork PR, split-trust)
        # Build HTML from trusted base; run docs2mdx.py from PR head via Python only.
        if: ${{ inputs.is_internal_pr && steps.reference-regen.outputs.split_trust == 'true' && steps.docs-changes.outputs.should_run == 'true' }}
        env:
          BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
          BASE_SHA: ${{ inputs.bazelBaseCommitHash }}
          HEAD_SHA: ${{ inputs.bazelCommitHash }}
        run: |
          set -euo pipefail
          rcfile="$(mktemp)"
          printf 'build --remote_header=x-buildbuddy-api-key=%s\n' "${BUILDBUDDY_ORG_API_KEY}" > "${rcfile}"
          export BAZEL_EXTRA_RCFILE="${rcfile}"
          chmod +x scripts/regen_reference_docs_split_trust.sh
          ./scripts/regen_reference_docs_split_trust.sh "${BASE_SHA}" "${HEAD_SHA}"
      
      - name: Upload reference docs artifact
        if: ${{ inputs.is_internal_pr && steps.docs-changes.outputs.should_run == 'true' && (steps.reference-regen.outputs.full_build == 'true' || steps.reference-regen.outputs.split_trust == 'true') && github.ref != 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: reference-docs
          path: upstream/bazel-bin/src/main/java/com/google/devtools/build/lib/mdx-reference-docs.zip
          retention-days: 7

      - name: Sync pre-converted MDX docs from upstream
        if: ${{ steps.docs-changes.outputs.should_run == 'true' }}
        run: |
          # Copy all MDX files from the upstream docs directory to the root.
          # Versioned docs live under upstream/docs/versions/ and are copied into versions/.
          rsync -av --include='*/' --include='*.mdx' --include='*.md' --include='*.png' --include='*.jpg' --include='*.svg' --exclude='*' upstream/docs/ .
          
      - name: Extract MDX reference docs
        if: ${{ inputs.is_internal_pr && steps.docs-changes.outputs.should_run == 'true' && (steps.reference-regen.outputs.full_build == 'true' || steps.reference-regen.outputs.split_trust == 'true') }}
        run: |
          unzip -o upstream/bazel-bin/src/main/java/com/google/devtools/build/lib/mdx-reference-docs.zip -d .

      - name: Create versioned navigation
        if: ${{ steps.docs-changes.outputs.should_run == 'true' }}
        run: ./navigation.update.sh

      - name: Remove .mintignore entries from navigation files
        # TODO: versioned nav entries (e.g. 8.4.2/query/language) are not cleaned up here
        if: ${{ steps.docs-changes.outputs.should_run == 'true' }}
        run: |
          while IFS= read -r pattern; do
            # Skip comments and blank lines
            [[ "$pattern" =~ ^[[:space:]]*# || -z "${pattern// }" ]] && continue
            # Expand glob patterns against actual files, strip .mdx for the page ref
            for file in $pattern; do
              [[ -f "$file" ]] || continue
              page="${file%.mdx}"
              for nav_file in navigation/*.json; do
                tmp=$(jq --arg p "$page" 'walk(if type == "array" then map(select(. != $p)) else . end)' "$nav_file")
                echo "$tmp" > "$nav_file"
              done
            done
          done < .mintignore

      - name: Commit and push changes
        if: ${{ inputs.is_internal_pr && steps.docs-changes.outputs.should_run == 'true' }}
        env:
          BRANCH_OVERRIDE: ${{ inputs.target_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_APP_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail

          BRANCH="${BRANCH_OVERRIDE:-${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}}"
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-main}"

          # Clean up any modified content in submodules (keep pointer changes)
          cd upstream
          git reset --hard
          git clean -fd
          cd ..

          if [[ -n "${BRANCH_OVERRIDE}" ]]; then
            # Preview branch: commit on current HEAD and force-push to target.
            # Avoids branch-switching conflicts with rsync'd working tree files.
            git checkout -b "${BRANCH}" 2>/dev/null || git checkout "${BRANCH}"
          else
            # Main sync: rebase onto origin/BRANCH before committing to preserve history.
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
              git fetch origin "$BRANCH"
              git switch -C "$BRANCH" "origin/$BRANCH"
              git branch --set-upstream-to="origin/$BRANCH" "$BRANCH"
              git pull
            else
              git fetch origin "$DEFAULT_BRANCH"
              git switch -C "$BRANCH" "origin/$DEFAULT_BRANCH"
              git branch --set-upstream-to="origin/$DEFAULT_BRANCH" "$BRANCH"
            fi
          fi
          
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Changes detected, committing and pushing..."
            git add -A
            git commit -m $'chore: update documentation from upstream Bazel repo [skip ci]\n\nSynchronized pre-converted MDX files from upstream Bazel repository.'
          
            # Force-push for preview branches (ephemeral); normal push for main sync.
            if [[ -n "${BRANCH_OVERRIDE}" ]]; then
              git push origin "HEAD:$BRANCH" --force
            else
              git push origin "HEAD:$BRANCH"
            fi
            echo "Changes committed and pushed successfully"
          else
            echo "No changes detected, skipping commit"
          fi

      - name: Ensure draft PR exists for Mintlify preview
        if: ${{ inputs.is_internal_pr && inputs.target_branch != '' && steps.docs-changes.outputs.should_run == 'true' }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PREVIEW_BRANCH: ${{ inputs.target_branch }}
          PR_NUMBER: ${{ inputs.bazelPullRequestNumber }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          set -euo pipefail
          existing=$(gh pr list --repo "${{ github.repository }}" --head "${PREVIEW_BRANCH}" \
            --json number --jq '.[0].number // empty')
          if [[ -z "${existing}" ]]; then
            gh pr create \
              --repo "${{ github.repository }}" \
              --head "${PREVIEW_BRANCH}" \
              --base "${DEFAULT_BRANCH}" \
              --title "docs preview: bazelbuild/bazel#${PR_NUMBER}" \
              --body "Auto-generated Mintlify preview for [bazelbuild/bazel#${PR_NUMBER}](https://github.com/bazelbuild/bazel/pull/${PR_NUMBER})." \
              --draft
            echo "Draft PR created for ${PREVIEW_BRANCH}"
          else
            echo "Draft PR #${existing} already exists for ${PREVIEW_BRANCH}"
          fi
